<ion-header>
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-menu-button></ion-menu-button>
        </ion-buttons>
        <ion-title>Notizen</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content padding>
    <ion-item>
        <ion-input type="text" placeholder="Enter task" [(ngModel)]="taskName"></ion-input>
    </ion-item>
    <div padding>
        <ion-list>
            <ion-item *ngFor="let todo of taskList; let i = index">
                {{todo}}
                <div class="item-note" slot="end">
                    <ion-button color="danger" clear (click)="deleteTask(i)">
                        <ion-icon name="trash"></ion-icon>
                    </ion-button>
                    <ion-button color="success" clear (click)="editTask(todo, i)">
                        <ion-icon name="create-outline"></ion-icon>
                    </ion-button>
                </div>
            </ion-item>
        </ion-list>
    </div>
</ion-content>
<div class="item-note">
    <ion-button color="primary" (click)="addTask()">
        <ion-icon name="add"></ion-icon>
    </ion-button>
</div>
