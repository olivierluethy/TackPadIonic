<ion-content class="ion-no-padding">
    <ion-grid fixed>
        <ion-row>
            <ion-col size="12">
                <img src="/assets/register.png" class="icon" />
            </ion-col>
            <ion-col size="12">
                <h1>Registration</h1>
            </ion-col>
        </ion-row>
        <form [formGroup]="registerForm" (ngSubmit)="sendContactForm()">
            <ion-row>
                <ion-col size="12">
                    <ion-item>
                        <ion-label position="stacked">Username:</ion-label>
                        <ion-input required formControlName="username" type="text"></ion-input>
                    </ion-item>
                </ion-col>
                <ion-col size="12">
                    <ion-item>
                        <ion-label position="stacked">Email:</ion-label>
                        <ion-input required formControlName="email" type="email"></ion-input>
                    </ion-item>
                </ion-col>
                <ion-col size="12">
                    <ion-item>
                        <ion-label position="stacked">Passwort:</ion-label>
                        <ion-input required formControlName="password" type="password"></ion-input>
                    </ion-item>
                </ion-col>
                <ion-col size="12">
                    <ion-item>
                        <ion-label position="stacked">
                            Confirm Password:
                        </ion-label>
                        <ion-input required formControlName="password_repeat" type="password"></ion-input>
                    </ion-item>
                </ion-col>
                <div class="formErrors">
                    <ion-item color="danger" *ngIf="!registerForm.controls.username.valid && !registerForm.controls.username.pending && (registerForm.controls.username.dirty)">
                        Sorry, that username is either to short or not yet provided!
                    </ion-item>
                    <ion-item color="danger" *ngIf="!registerForm.controls.email.valid && !registerForm.controls.email.pending && (registerForm.controls.email.dirty)">
                        Sorry, that email is either to short or not yet provided!
                    </ion-item>
                    <ion-item color="danger" *ngIf="!registerForm.controls.password.valid && !registerForm.controls.password.pending && (registerForm.controls.password.dirty)">
                        Sorry, that password is not correct!
                    </ion-item>
                </div>
                <ion-col size="12">
                    <ion-button expand="block" [disabled]="registerForm.invalid">
                        Account erstellen
                    </ion-button>
                </ion-col>
            </ion-row>
        </form>
    </ion-grid>
</ion-content>
